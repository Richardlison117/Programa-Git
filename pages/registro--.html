<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Minuta Digital 360</title>

    <link rel="stylesheet" href="../css/registro.css">
</head>

<body>

<div class="fondo">

    <div class="registro-card">

        <a href="../index.html" class="top-link">
            ← Volver
        </a>

        <img src="../imagenes/logo-minuta-digital-360-.png"
             alt="Minuta Digital 360"
             class="logo">

        <h2>Registro de Usuario</h2>

        <p class="subtitle">
            Complete la información para crear una cuenta.
        </p>

        <form autocomplete="off">

            <input type="text" placeholder="Nombres" required>
            <input type="text" placeholder="Apellidos" required>
            <input type="number" placeholder="Cédula" required>
            <input type="email" placeholder="Correo electrónico" required>
            <input type="date" required>
            <input type="password" placeholder="Contraseña" required>
            <input type="password" placeholder="Confirmar contraseña" required>

            <button type="submit" class="btn">
                Registrarse
            </button>

        </form>

        <a href="login.html" class="link">
            Iniciar sesión
        </a>

        <small class="footer-login">
            Minuta Digital 360 • 2026
        </small>

    </div>

</div>

</body>
</html>
